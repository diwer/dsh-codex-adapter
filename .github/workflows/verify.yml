name: Verify plugin package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:protocol
      - run: npm run verify
      - run: npm run test:runtime
      - run: npm run docs:build
      - run: npm run market:check
      - run: npm run market:prepare -- --repository "https://github.com/${GITHUB_REPOSITORY}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-release-and-test-results
          path: |
            outputs/market/
            outputs/test-reports/
